# docker-compose.prod.yml — Production overlay (Nginx-based VPS)
# Usage:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# What this file does versus the base compose:
#  • Exposes the CRM app on 127.0.0.1:4000 for Nginx reverse-proxy
#  • Publishes ws-server on 127.0.0.1:4001 for Nginx /socket.io proxying
#  • Adds Evolution API with its own isolated Postgres + Redis
#  • Adds persistent volumes for Evolution state
#  • Puts ai-agent under a profile so it only starts when explicitly requested
#  • No Caddy — the host Nginx handles TLS and public ports 80/443

services:

  # ── CRM app — bind to localhost:4000 for Nginx ─────────────────────────
  app:
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CRM_APP_HOST_PORT:-4000}:3000"
    environment:
      EVOLUTION_API_URL: "http://evolution:8080"
      EVOLUTION_API_KEY: "${EVOLUTION_API_KEY}"
      EVOLUTION_INSTANCE_NAME: "${EVOLUTION_INSTANCE_NAME}"
      EVOLUTION_WEBHOOK_SECRET: "${EVOLUTION_WEBHOOK_SECRET}"
      EVOLUTION_WEBHOOK_URL: "https://${DOMAIN}/api/evolution/webhook"
      EVOLUTION_OWNER_USER_ID: "${EVOLUTION_OWNER_USER_ID:-}"
      EVOLUTION_BUSINESS_ALIASES: "${EVOLUTION_BUSINESS_ALIASES:-Tiles CRM,Homzentic,Tiles,Granite,Marble}"
      GROQ_ROUTING_MODEL: "${GROQ_ROUTING_MODEL:-llama-3.1-8b-instant}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_ROUTING_MODEL: "${ANTHROPIC_ROUTING_MODEL:-claude-haiku-4-5-20251001}"
      NEXT_PUBLIC_WS_URL: "https://${DOMAIN}"
    networks:
      - internal
      - edge
    depends_on:
      evolution:
        condition: service_healthy

  # ── WebSocket gateway — internal services + host Nginx edge ───────────
  ws-server:
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CRM_WS_HOST_PORT:-4001}:3001"
    networks:
      - internal
      - edge

  # ── CRM Postgres — internal ───────────────────────────────────────────
  db:
    networks:
      - internal

  # ── CRM Redis — internal ──────────────────────────────────────────────
  redis:
    networks:
      - internal

  # ── Migration job — internal ──────────────────────────────────────────
  migrate:
    networks:
      - internal

  # ── Evolution API ─────────────────────────────────────────────────────
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SERVER_URL: "https://${DOMAIN}/evolution"
      DEL_INSTANCE: "false"
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: "${EVOLUTION_API_KEY}"
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: "postgresql://${EVO_PG_USER:-evolution}:${EVO_PG_PASSWORD}@evolution-db:5432/${EVO_PG_DB:-evolutiondb}"
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: "redis://evolution-redis:6379"
      CACHE_REDIS_PREFIX_KEY: "evolution"
      CACHE_REDIS_SAVE_INSTANCES: "true"
      STORE_MESSAGES: "true"
      STORE_MESSAGE_UP: "true"
      STORE_CONTACTS: "true"
      STORE_CHATS: "true"
      WEBHOOK_GLOBAL_ENABLED: "false"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      LOG_LEVEL: "ERROR,WARN,INFO"
      LOG_COLOR: "true"
      LOG_BAILEYS: "error"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      evolution-db:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - internal

  # ── Evolution Postgres ────────────────────────────────────────────────
  evolution-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${EVO_PG_USER:-evolution}"
      POSTGRES_PASSWORD: "${EVO_PG_PASSWORD}"
      POSTGRES_DB: "${EVO_PG_DB:-evolutiondb}"
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVO_PG_USER:-evolution}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Evolution Redis ───────────────────────────────────────────────────
  evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - evolution_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

volumes:
  evolution_instances:
  evolution_pgdata:
  evolution_redisdata:

networks:
  internal:
    internal: true
  # Host-published app/WebSocket ports must attach to a non-internal bridge.
  # Databases, Redis, and Evolution remain isolated on `internal` only.
  edge:
    driver: bridge
